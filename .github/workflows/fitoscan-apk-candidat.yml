      - name: Isolate debug APK from existing installation
        shell: bash
        run: |
          python3 - <<'PYISOLATE'
          from pathlib import Path
          p = Path('app/build.gradle.kts')
          s = p.read_text()
          anchor = '    defaultConfig {'
          assert s.count(anchor) == 1
          s = s.replace(anchor, '    buildTypes {\n        getByName("debug") { applicationIdSuffix = ".candidate" }\n    }\n' + anchor)
          p.write_text(s)
          p = Path('app/src/main/AndroidManifest.xml')
          s = p.read_text()
          assert s.count('android:label="FitoScan-AI"') == 1
          p.write_text(s.replace('android:label="FitoScan-AI"', 'android:label="FitoScan-AI Test"'))
          PYISOLATE
      - name: Remove unused legacy Kotlin plugin declaration
        shell: bash
        run: |
          python3 - <<'PYKOTLIN'
          from pathlib import Path
          p = Path('build.gradle.kts')
          s = p.read_text()
          line = '    id("org.jetbrains.kotlin.android") version "2.4.10" apply false\n'
          assert s.count(line) == 1
          assert 'org.jetbrains.kotlin.android' not in Path('app/build.gradle.kts').read_text()
          p.write_text(s.replace(line, ''))
          PYKOTLIN
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 9.8.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.0'
          cache-disabled: true
      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          if [[ -f "$sdk/platforms/android-35/android.jar" && -x "$sdk/build-tools/36.0.0/apksigner" ]]; then
            echo "Required Android SDK components already installed."
            exit 0
          fi
          manager="$(command -v sdkmanager || true)"
          if [[ -z "$manager" ]]; then
            manager="$(find "$sdk/cmdline-tools" -type f -path '*/bin/sdkmanager' 2>/dev/null | sort -V | tail -n 1 || true)"
          fi
          if [[ -z "$manager" || ! -x "$manager" ]]; then
            echo "::error::Android SDK command-line tools unavailable at $sdk"
            exit 1
          fi
          "$manager" --sdk_root="$sdk" 'platforms;android-35' 'build-tools;36.0.0'
      - name: Build debug APK and capture log
        shell: bash
        run: |
          set -euo pipefail
          gradle --version
          gradle --no-daemon --stacktrace :app:assembleDebug 2>&1 | tee "$RUNNER_TEMP/fitoscan-build.log"
      - name: Verify APK signature and compute SHA256
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p apk-output
          cp app/build/outputs/apk/debug/app-debug.apk apk-output/FitoScan-AI-Test.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose apk-output/FitoScan-AI-Test.apk
          (cd apk-output && sha256sum FitoScan-AI-Test.apk > SHA256SUMS.txt)
      - name: Upload signed debug APK
        uses: actions/upload-artifact@v4
        with:
          name: FitoScan-AI-Test-APK
          path: apk-output/
          if-no-files-found: error
          retention-days: 7
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FitoScan-AI-build-log
          path: ${{ runner.temp }}/fitoscan-build.log
          if-no-files-found: ignore
          retention-days: 7
